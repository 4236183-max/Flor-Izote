<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · Flor de Izote</title><link rel="icon" type="image/png" href="/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css"></head>
<body><div class="login-wrap"><form class="panel" id="f">
  <div style="text-align:center;margin-bottom:18px"><img src="/images/logo-completo.png" width="220" alt="Flor de Izote" style="margin:auto;border-radius:16px"><h2 class="serif" style="margin-top:8px">Panel administrativo</h2><small>Flor de Izote</small></div>
  <div class="field"><label>Usuario</label><input name="usuario" autocomplete="username" required></div>
  <div class="field"><label>Contraseña</label><input type="password" name="password" autocomplete="current-password" required></div>
  <button class="btn" style="width:100%;justify-content:center" type="submit">Ingresar</button>
  <p style="text-align:center;margin-top:12px"><a href="/" style="font-size:.85rem">← Volver al sitio</a></p>
</form></div>
<script src="/js/common.js"></script>
<script>
$('#f').onsubmit = async (e) => {
  e.preventDefault(); const fd = new FormData(e.target);
  try { await api('/api/auth/login', { method: 'POST', body: { usuario: fd.get('usuario'), password: fd.get('password') } }); location.href = '/admin'; }
  catch (er) { toast(er.message, 'err'); }
};
</script></body></html>
